    // Compress uploaded Avatar to 256x256 JPEG via offscreen Canvas

      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const minSide = Math.min(img.width, img.height);
            const sx = (img.width - minSide) / 2;
            const sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 256, 256);
            callback(canvas.toDataURL('image/jpeg', 0.82));
          } catch (err) {
            callback(ev.target.result);
          }
        };
        img.onerror = () => callback(ev.target.result);
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

      const kaabaLng = (39.8262 * Math.PI) / 180;
      const phi = (lat * Math.PI) / 180;
      const lambda = (lng * Math.PI) / 180;
      const deltaLng = kaabaLng - lambda;
      const y = Math.sin(deltaLng);
      const x = Math.cos(phi) * Math.tan(kaabaLat) - Math.sin(phi) * Math.cos(deltaLng);
      let brng = (Math.atan2(y, x) * 180) / Math.PI;
      return Math.round((brng + 360) % 360);

    // --- SOUND & HAPTIC AUDIO ENGINE (Respects Global Settings Toggles) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.soundEnabled = true;
        this.hapticsEnabled = true;
      }

    // --- ASTRONOMICAL PRAYER TIME ENGINE ---
    function calculatePrayerTimes(date = new Date(), latitude = 31.2001, longitude = 29.9187, fajrAngle = 18.5, ishaAngle = 17.5) {
      const d = new Date(date);
      const dayOfYear = Math.floor((d.getTime() - new Date(d.getFullYear(), 0, 0).getTime()) / (1000 * 60 * 60 * 24));
      const b = (2 * Math.PI * (dayOfYear - 81)) / 365;
      const eqTime = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
      const declination = 23.45 * Math.sin(((dayOfYear - 81) * 2 * Math.PI) / 365);
      const degToRad = (deg) => (deg * Math.PI) / 180;
      const radToDeg = (rad) => (rad * 180) / Math.PI;
      const timezoneOffsetHours = -d.getTimezoneOffset() / 60;
      const solarNoonMinutes = 720 - 4 * longitude - eqTime + timezoneOffsetHours * 60;
      const latRad = degToRad(latitude);
      const decRad = degToRad(declination);
      const getHourAngle = (angle) => {
        const angleRad = degToRad(angle);
        const cosHA = (Math.sin(angleRad) - Math.sin(latRad) * Math.sin(decRad)) / (Math.cos(latRad) * Math.cos(decRad));
        if (cosHA > 1 || cosHA < -1) return 0;
        return radToDeg(Math.acos(cosHA));
      };
      const noonSunAngle = 90 - Math.abs(latitude - declination);
      const asrSunAngle = radToDeg(Math.atan(1 / (1 + 1 / Math.tan(degToRad(noonSunAngle)))));
      const fajrHA = getHourAngle(-fajrAngle);
      const sunriseHA = getHourAngle(-0.833);
      const asrHA = getHourAngle(asrSunAngle);
      const maghribHA = getHourAngle(-0.833);
      const ishaHA = getHourAngle(-ishaAngle);
      const formatTime = (totalMinutes) => {
        let normalized = Math.round(totalMinutes);
        while (normalized < 0) normalized += 1440;
        while (normalized >= 1440) normalized -= 1440;
        const hours = Math.floor(normalized / 60);
        const mins = normalized % 60;
        return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
      };
      return [
        { id: 'fajr', nameAr: 'الفجر', nameEn: 'Fajr', time: formatTime(solarNoonMinutes - fajrHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'sunrise', nameAr: 'الشروق', nameEn: 'Sunrise', time: formatTime(solarNoonMinutes - sunriseHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 0 },
        { id: 'dhuhr', nameAr: 'الظهر', nameEn: 'Dhuhr', time: formatTime(solarNoonMinutes), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'asr', nameAr: 'العصر', nameEn: 'Asr', time: formatTime(solarNoonMinutes + asrHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'maghrib', nameAr: 'المغرب', nameEn: 'Maghrib', time: formatTime(solarNoonMinutes + maghribHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
        { id: 'isha', nameAr: 'العشاء', nameEn: 'Isha', time: formatTime(solarNoonMinutes + ishaHA * 4), completed: false, sunnahCompleted: false, preAlertMinutes: 10 },
      ];
    }

    function formatClockDisplay(time24Str, formatMode = '24h') {
      if (!time24Str || formatMode === '24h') return time24Str;
      const parts = time24Str.split(':');
      if (parts.length < 2) return time24Str;
      let h = parseInt(parts[0], 10);
      const m = parts[1];
      const suffix = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m} ${suffix}`;
    }

    function getUpcomingPrayer(prayers, now = new Date()) {
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      for (const prayer of prayers) {
        if (prayer.id === 'sunrise') continue;
        const [h, m] = prayer.time.split(':').map(Number);
        const prayerMinutes = h * 60 + m;
        if (prayerMinutes > currentMinutes) {
          const diff = prayerMinutes - currentMinutes;
          return { prayer, minutesRemaining: diff };
        }
      }
      const fajr = prayers.find((p) => p.id === 'fajr') || prayers[0];
      const [fh, fm] = fajr.time.split(':').map(Number);
      const diff = 1440 - currentMinutes + (fh * 60 + fm);
      return { prayer: fajr, minutesRemaining: diff };
    }

    function calculateCacheSizeKB() {
      try {
        let total = 0;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          const v = localStorage.getItem(k) || '';
          total += (k.length + v.length) * 2;
        }
        return Math.max(12, Math.round(total / 1024));
      } catch (e) {
        return 24;
      }
    }

        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `sahly_day_backup_${dateStr}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        rows.push(['Hydration', 'Daily Water', `${state.hydration.currentMl} ml`, `${state.hydration.targetMl} ml`, new Date().toISOString().slice(0, 10)]);
        rows.push(['Vitals', 'Blood Pressure', state.vitals.bloodPressure || '', 'Normal: 120/80', 'Daily Log']);

        rows.push(['Nutrition', 'Protein & Calories', `${state.vitals.proteinGrams || 0}g Protein`, `${state.vitals.caloriesConsumed || 0} kcal`, 'Daily Log']);
        (state.prayers || []).forEach((p) => {
          rows.push(['Prayer', p.nameEn || p.nameAr, p.completed ? 'Completed' : 'Pending', p.sunnahCompleted ? 'Sunnah Done' : '-', p.time]);

        });
        const csvContent = rows.map((r) => r.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });

    // --- ZERO-TRACE STEALTH CLOUD SYNC ---
    async function pushClientStateToCloud(state) {
      const gatewayUrl = getSahlyCloudGateway();
      if (!gatewayUrl || state.user.autoSyncEnabled === false) return { ok: false };
      const clientKey = (state.user.email && state.user.email !== 'user@sahly.day')
        ? state.user.email.trim().toLowerCase()
        : state.user.clientId;
      const vaultContainerId = ('Client_' + clientKey.replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g, '_')).slice(0, 30);

      try {
        await fetch(gatewayUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'SYNC_USER_VAULT',
            clientId: state.user.clientId,
            email: state.user.email,
            vaultContainerId: vaultContainerId,
            state: state,
            version: APP_VERSION
          })
        });
        return { ok: true, syncedAt: new Date().toLocaleTimeString() };
      } catch (err) {
        return { ok: false };
      }
    }

    async function fetchClientStateFromCloud(email, clientId) {
      const gatewayUrl = getSahlyCloudGateway();
      if (!gatewayUrl) return null;
      try {
        const query = `?email=${encodeURIComponent(email || '')}&clientId=${encodeURIComponent(clientId || '')}`;
        const res = await fetch(`${gatewayUrl}${query}`);
        const data = await res.json();
        if (data && data.success && data.found && data.state) {
          return data;
        }
      } catch (err) { }
      return null;
    }

    function syncDOMAppearance(user) {
      const langCode = user.language || 'ar';
      const langObj = LANGUAGES_LIST.find((l) => l.code === langCode) || LANGUAGES_LIST[0];
      document.documentElement.lang = langObj.code;
      document.documentElement.dir = langObj.dir;

      // Resolve Theme Mode (Light / Dark / System OS Auto-Detect)
      let activeTheme = user.theme || 'cyber';
      if (user.themeMode === 'light') {
        if (!['daylight', 'nordic'].includes(activeTheme)) activeTheme = 'daylight';
      } else if (user.themeMode === 'dark') {
        if (['daylight', 'nordic'].includes(activeTheme)) activeTheme = 'cyber';
      } else if (user.themeMode === 'system' && typeof window !== 'undefined' && window.matchMedia) {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        activeTheme = prefersDark ? (['daylight', 'nordic'].includes(activeTheme) ? 'cyber' : activeTheme) : 'daylight';
      }

      document.documentElement.setAttribute('data-theme', activeTheme);
      document.documentElement.setAttribute('data-font-scale', user.fontScale || 'normal');
      document.documentElement.setAttribute('data-density', user.uiDensity || 'comfortable');
      document.documentElement.setAttribute('data-motion', user.reduceMotion ? 'reduced' : 'full');

      if (user.accentColor) {
        document.documentElement.style.setProperty('--primary-color', user.accentColor);
      }
      soundFX.configure(user.soundEffects !== false, user.hapticVibration !== false);
    }

    // --- SVG CIRCULAR PROGRESS RING ---
    const CircularProgressRing = ({ percentage = 0, size = 110, strokeWidth = 10, label = '' }) => {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (Math.min(100, Math.max(0, percentage)) / 100) * circumference;
      return (
        <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="-rotate-90 transform">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="rgba(148, 163, 184, 0.18)" strokeWidth={strokeWidth} fill="transparent" />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke="var(--accent-main)"
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              fill="transparent"
              style={{ transition: 'stroke-dashoffset 0.6s cubic-bezier(0.22, 1, 0.36, 1)' }}
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="font-mono font-black text-xl leading-none">{percentage}%</span>
            {label && <span className="text-[10px] theme-text-muted font-bold mt-1">{label}</span>}
          </div>
        </div>
      );

                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.gender}</label>
                        <select
                          value={profile.gender}

                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.country}</label>

                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.bio}</label>
                        <input
                          type="text"
                          value={profile.bio}
                          onChange={(e) => setProfile({ ...profile, bio: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold"
                        />
                      </div>
                    </div>
                  </div>
                )}

                {step === 2 && (
                  <div className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {Object.keys(dict.ageGroups).map((gKey) => {
                        const item = dict.ageGroups[gKey];
                        const active = profile.ageGroup === gKey;
                        return (
                          <button
                            key={gKey}
                            type="button"
                            onClick={() => handleSelectAgeGroup(gKey)}
                            className={`p-3.5 rounded-2xl border logical-start-text transition-all ${active ? 'border-cyan-400 bg-cyan-500/15 shadow-lg' : 'glass-card opacity-85'
                              }`}
                          >
                            <div className="font-black text-sm">{item.label}</div>
                            <div className="text-xs theme-text-muted mt-1">{item.desc}</div>
                          </button>
                        );
                      })}
                    </div>

                    <div className="grid grid-cols-3 gap-2.5">
                      <div className="glass-card p-3 rounded-2xl text-center">
                        <label className="block text-xs font-bold theme-text-muted mb-1">Weight (kg)</label>
                        <input
                          type="number"
                          value={profile.weightKg}
                          onChange={(e) => {
                            const w = Number(e.target.value) || 70;
                            setProfile({ ...profile, weightKg: w, waterDailyTargetMl: Math.round(w * 35) });
                          }}

                      </div>
                      <div className="glass-card p-3 rounded-2xl text-center">
                        <label className="block text-xs font-bold theme-text-muted mb-1">Height (cm)</label>
                        <input
                          type="number"
                          value={profile.heightCm}
                          onChange={(e) => setProfile({ ...profile, heightCm: Number(e.target.value) || 170 })}
                          className="w-full surface-field rounded-xl py-2 text-center font-black"
                        />
                      </div>
                      <div className="glass-card p-3 rounded-2xl text-center">
                        <label className="block text-xs font-bold theme-text-muted mb-1">Workout Split</label>
                        <select
                          value={profile.workoutSplitId}
                          onChange={(e) => setProfile({ ...profile, workoutSplitId: e.target.value })}
                          className="w-full surface-field rounded-xl py-2 px-2 text-xs font-bold"

                          {Object.keys(SPLIT_DEFINITIONS).map((sKey) => (
                            <option key={sKey} value={sKey}>
                              {isRtl ? SPLIT_DEFINITIONS[sKey].nameAr : SPLIT_DEFINITIONS[sKey].nameEn}
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="glass-card p-3.5 rounded-2xl">
                      <div className="grid grid-cols-7 gap-1.5">
                        {[6, 0, 1, 2, 3, 4, 5].map((dIdx) => {
                          const active = profile.trainingDays.includes(dIdx);
                          return (
                            <button
                              key={dIdx}
                              type="button"
                              onClick={() => toggleTrainingDay(dIdx)}
                              className={`py-2 rounded-xl text-xs font-black border touch-target ${active ? 'btn-primary border-transparent' : 'surface-field opacity-75'
                                }`}
                            >
                              {isRtl ? DAYS_AR[dIdx] : DAYS_EN[dIdx].slice(0, 3)}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                <div className="flex flex-wrap items-center justify-between gap-2 border-t theme-border pt-4 mt-6">
                  {step > 1 ? (
                    <button
                      type="button"
                      onClick={() => setStep(step - 1)}
                      className="px-5 py-2.5 rounded-xl glass-card text-xs font-black touch-target"
                    >
                      {dict.common.cancel}
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => {
                        soundFX.playCelebration();
                        onComplete({ ...profile, isOnboarded: true });
                      }}
                      className="px-4 py-2.5 rounded-xl glass-card text-xs font-bold touch-target"
                    >
                      {dict.auth.quickContinue}
                    </button>
                  )}

                  <button
                    type="button"
                    onClick={() => {
                      if (step < 2) {
                        soundFX.playClick();
                        setStep(step + 1);
                      } else {
                        soundFX.playCelebration();
                        onComplete({ ...profile, isOnboarded: true });
                      }
                    }}
                    className="btn-primary px-6 py-2.5 rounded-xl text-sm font-black touch-target"
                  >
                    {step < 2 ? '→' : dict.auth.createAccountBtn}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============================================================================
    // 2. COMPREHENSIVE 6-TAB GLOBAL SETTINGS DRAWER / MODAL
    // ============================================================================
    const GlobalSettingsModal = ({
      isOpen,
      onClose,
      user,
      onUpdateUser,
      onLogoutAccount,
      onDeleteAccountPermanently,
      onShowToast
    }) => {
      const [activeSection, setActiveSection] = useState('profile');
      const [draftProfile, setDraftProfile] = useState(user);
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [deleteConfirmText, setDeleteConfirmText] = useState('');
      const [cacheSizeKB, setCacheSizeKB] = useState(() => calculateCacheSizeKB());
      const [legalDocModal, setLegalDocModal] = useState(null); // 'privacy' | 'terms' | 'support' | null

      useEffect(() => {
        setDraftProfile(user);
        setCacheSizeKB(calculateCacheSizeKB());
      }, [user, isOpen]);

      if (!isOpen) return null;

      const lang = user.language || 'ar';
      const dict = I18N[lang] || I18N.ar;
      const s = dict.settings;
      const isRtl = dict.dir === 'rtl';

      const handleAvatarUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        compressAvatarImage(file, (compressedDataUrl) => {
          setDraftProfile((prev) => ({ ...prev, avatar: compressedDataUrl }));
          onUpdateUser({ avatar: compressedDataUrl });
        });
      };

      const handleSaveProfileChanges = () => {
        if (!draftProfile.name || !draftProfile.email) {
          onShowToast('⚠️ Name and Email are required');
          return;
        }
        soundFX.playCelebration();
        onUpdateUser({
          name: draftProfile.name,
          username: draftProfile.username,
          email: draftProfile.email,
          phone: draftProfile.phone,
          dateOfBirth: draftProfile.dateOfBirth,
          gender: draftProfile.gender,
          country: draftProfile.country,
          cityName: draftProfile.country || draftProfile.cityName,
          bio: draftProfile.bio,
          avatar: draftProfile.avatar
        });
        onShowToast(s.profileSec.savedToast);
      };

      const handlePasswordChange = () => {
        if (!newPass || newPass.length < 4 || newPass !== confirmPass) {
          onShowToast('⚠️ Passwords must match and be at least 4 characters');
          return;
        }
        soundFX.playCelebration();
        setCurrentPass('');
        setNewPass('');
        setConfirmPass('');
        onShowToast('🔐 Password updated securely!');
      };

      const handleClearCache = () => {
        soundFX.playCelebration();
        setCacheSizeKB(2);
        onShowToast(s.notificationsSec.cacheClearedToast);
      };

      const sections = [
        { id: 'profile', icon: '👤', label: s.tabs.profile },
        { id: 'security', icon: '🛡️', label: s.tabs.security },
        { id: 'appearance', icon: '🎨', label: s.tabs.appearance },
        { id: 'language', icon: '🌐', label: s.tabs.language },
        { id: 'notifications', icon: '🔔', label: s.tabs.notifications },
        { id: 'legal', icon: 'ℹ️', label: s.tabs.legal }
      ];

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-2 sm:p-5">
          <div className="w-full max-w-5xl hero-card rounded-3xl overflow-hidden flex flex-col max-h-[92vh] shadow-2xl">
            {/* Modal Header */}
            <div className="flex items-center justify-between px-5 py-4 border-b theme-border">
              <div className="flex items-center gap-3">
                <span className="w-10 h-10 rounded-2xl btn-primary flex items-center justify-center text-lg">⚙️</span>
                <div className="logical-start-text">
                  <h2 className="text-base sm:text-lg font-black leading-tight">{s.title}</h2>
                  <p className="text-xs theme-text-muted">{s.subtitle}</p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="w-10 h-10 rounded-2xl glass-card flex items-center justify-center font-black text-sm"
              >
                ✕
              </button>
            </div>

            {/* Body: Sidebar Tabs + Active Section Content */}
            <div className="flex-1 overflow-hidden flex flex-col md:flex-row">
              {/* Navigation Sidebar */}
              <div className="md:w-64 border-b md:border-b-0 md:border-e theme-border p-3 flex md:flex-col gap-1.5 overflow-x-auto md:overflow-y-auto shrink-0">
                {sections.map((sec) => {
                  const active = activeSection === sec.id;
                  return (
                    <button
                      key={sec.id}
                      type="button"
                      onClick={() => { soundFX.playClick(); setActiveSection(sec.id); }}
                      className={`px-3.5 py-2.5 rounded-2xl text-xs font-black flex items-center gap-2.5 shrink-0 transition-all touch-target ${active ? 'btn-primary shadow-md' : 'surface-field opacity-80 hover:opacity-100'
                        }`}
                    >
                      <span>{sec.icon}</span>
                      <span>{sec.label}</span>
                    </button>
                  );
                })}
              </div>

              {/* Main Section Panel */}
              <div className="flex-1 p-4 sm:p-6 overflow-y-auto space-y-5 logical-start-text">
                {/* === A. PROFILE & PERSONAL INFORMATION === */}
                {activeSection === 'profile' && (
                  <div className="space-y-4">
                    <h3 className="text-base font-black accent-text">{s.profileSec.heading}</h3>

                    {/* Avatar Upload & Presets */}
                    <div className="surface-field p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                      <div className="flex items-center gap-3.5">
                        <img
                          src={draftProfile.avatar || AVATAR_PRESETS[0]}
                          alt="Profile Avatar"
                          className="w-16 h-16 rounded-full object-cover border-2 border-cyan-400 shadow-lg"
                        />
                        <div>
                          <div className="font-black text-sm">{draftProfile.name}</div>
                          <div className="text-xs theme-text-muted font-mono">@{draftProfile.username || 'user'}</div>
                          <label className="inline-block mt-1.5 px-3 py-1.5 rounded-xl btn-primary text-xs font-black cursor-pointer">
                            <span>{dict.auth.uploadAvatar}</span>
                            <input type="file" accept="image/*" onChange={handleAvatarUpload} className="hidden" />
                          </label>
                        </div>
                      </div>
                      <div className="flex items-center gap-1.5">
                        {AVATAR_PRESETS.map((av, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => {
                              soundFX.playClick();
                              setDraftProfile({ ...draftProfile, avatar: av });
                              onUpdateUser({ avatar: av });
                            }}
                            className={`w-9 h-9 rounded-full overflow-hidden border-2 ${draftProfile.avatar === av ? 'border-cyan-400 scale-110' : 'border-transparent opacity-70'}`}
                          >
                            <img src={av} alt="Avatar Preset" className="w-full h-full object-cover" />
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Editable Profile Fields */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.fullName}</label>
                        <input
                          type="text"
                          value={draftProfile.name || ''}
                          onChange={(e) => setDraftProfile({ ...draftProfile, name: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.username}</label>
                        <input
                          type="text"
                          value={draftProfile.username || ''}
                          onChange={(e) => setDraftProfile({ ...draftProfile, username: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.email}</label>
                        <input
                          type="email"
                          value={draftProfile.email || ''}
                          onChange={(e) => setDraftProfile({ ...draftProfile, email: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.phone}</label>
                        <input
                          type="tel"
                          value={draftProfile.phone || ''}
                          onChange={(e) => setDraftProfile({ ...draftProfile, phone: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.dob}</label>
                        <input
                          type="date"
                          value={draftProfile.dateOfBirth || ''}
                          onChange={(e) => setDraftProfile({ ...draftProfile, dateOfBirth: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-mono font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.gender}</label>
                        <select
                          value={draftProfile.gender || 'male'}
                          onChange={(e) => setDraftProfile({ ...draftProfile, gender: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold"
                        >
                          <option value="male">{dict.auth.genderMale}</option>
                          <option value="female">{dict.auth.genderFemale}</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.country}</label>
                        <input
                          type="text"
                          value={draftProfile.country || ''}
                          onChange={(e) => setDraftProfile({ ...draftProfile, country: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold theme-text-muted mb-1">{dict.auth.bio}</label>
                        <input
                          type="text"
                          value={draftProfile.bio || ''}
                          onChange={(e) => setDraftProfile({ ...draftProfile, bio: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl surface-field text-xs font-bold"
                        />
                      </div>
                    </div>

                    <div className="pt-2">
                      <button
                        type="button"
                        onClick={handleSaveProfileChanges}
                        className="btn-primary px-6 py-2.5 rounded-2xl text-xs font-black touch-target"
                      >
                        {s.profileSec.saveBtn}
                      </button>
                    </div>
                  </div>
                )}

                {/* === B. ACCOUNT & SECURITY === */}
                {activeSection === 'security' && (
                  <div className="space-y-5">
                    <h3 className="text-base font-black accent-text">{s.securitySec.heading}</h3>

                    {/* Change Password */}
                    <div className="surface-field p-4 rounded-2xl space-y-3">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <input
                          type="password"
                          placeholder={s.securitySec.currentPass}
                          value={currentPass}
                          onChange={(e) => setCurrentPass(e.target.value)}
                          className="px-3 py-2 rounded-xl glass-card text-xs font-bold"
                        />
                        <input
                          type="password"
                          placeholder={s.securitySec.newPass}
                          value={newPass}
                          onChange={(e) => setNewPass(e.target.value)}
                          className="px-3 py-2 rounded-xl glass-card text-xs font-bold"
                        />
                        <input
                          type="password"
                          placeholder={s.securitySec.confirmPass}
                          value={confirmPass}
                          onChange={(e) => setConfirmPass(e.target.value)}
                          className="px-3 py-2 rounded-xl glass-card text-xs font-bold"
                        />
                      </div>
                      <button
                        type="button"
                        onClick={handlePasswordChange}
                        className="btn-primary px-4 py-2 rounded-xl text-xs font-black"
                      >
                        {s.securitySec.updatePassBtn}
                      </button>
                    </div>

                    {/* 2FA & Biometric Toggles */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="surface-field p-3.5 rounded-2xl flex items-center justify-between">
                        <span className="text-xs font-black">🔐 {s.securitySec.twoFactor}</span>
                        <button
                          type="button"
                          onClick={() => { soundFX.playClick(); onUpdateUser({ twoFactorEnabled: !user.twoFactorEnabled }); }}
                          className={`px-3 py-1.5 rounded-xl text-xs font-black ${user.twoFactorEnabled ? 'btn-primary' : 'glass-card opacity-70'}`}
                        >
                          {user.twoFactorEnabled ? 'ON' : 'OFF'}
                        </button>
                      </div>
                      <div className="surface-field p-3.5 rounded-2xl flex items-center justify-between">
                        <span className="text-xs font-black">🫆 {s.securitySec.biometric}</span>
                        <button
                          type="button"
                          onClick={() => { soundFX.playClick(); onUpdateUser({ biometricEnabled: !user.biometricEnabled }); }}
                          className={`px-3 py-1.5 rounded-xl text-xs font-black ${user.biometricEnabled ? 'btn-primary' : 'glass-card opacity-70'}`}
                        >
                          {user.biometricEnabled ? 'ON' : 'OFF'}
                        </button>
                      </div>
                    </div>

                    {/* Active Sessions Manager */}
                    <div className="surface-field p-4 rounded-2xl space-y-2.5">
                      <div className="text-xs font-black">{s.securitySec.activeSessions}</div>
                      {(user.activeSessions || []).map((sess) => (
                        <div key={sess.id} className="p-2.5 rounded-xl glass-card flex items-center justify-between text-xs">
                          <div>
                            <div className="font-black">{sess.device}</div>
                            <div className="text-[10px] theme-text-muted">{sess.location} • {sess.lastActive}</div>
                          </div>
                          {sess.current ? (
                            <span className="text-[10px] font-black text-emerald-400 px-2 py-0.5 rounded-full bg-emerald-500/15">
                              {s.securitySec.currentDevice}
                            </span>
                          ) : (
                            <button
                              type="button"
                              onClick={() => {
                                soundFX.playClick();
                                onUpdateUser({ activeSessions: user.activeSessions.filter((x) => x.id !== sess.id) });
                              }}
                              className="px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 text-[11px] font-black"
                            >
                              {s.securitySec.revokeBtn}
                            </button>
                          )}
                        </div>
                      ))}
                    </div>

                    {/* DANGER ZONE: Log Out & Delete Account Permanently */}
                    <div className="p-4 rounded-2xl border-2 border-rose-500/40 bg-rose-950/20 space-y-3">
                      <div className="text-xs font-black text-rose-400">⚠️ {s.securitySec.dangerZone}</div>
                      <div className="flex flex-wrap gap-2.5">
                        <button
                          type="button"
                          onClick={() => setShowLogoutConfirm(true)}
                          className="px-4 py-2.5 rounded-xl glass-card border border-amber-400/50 text-amber-300 text-xs font-black"
                        >
                          🚪 {s.securitySec.logoutBtn}
                        </button>
                        <button
                          type="button"
                          onClick={() => setShowDeleteConfirm(true)}
                          className="px-4 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-black hover:bg-rose-500"
                        >
                          🗑️ {s.securitySec.deleteAccountBtn}
                        </button>
                      </div>

                      {showLogoutConfirm && (
                        <div className="p-3.5 rounded-2xl surface-field border border-amber-400 space-y-2">
                          <div className="text-xs font-black text-amber-300">{s.securitySec.logoutConfirmTitle}</div>
                          <p className="text-xs theme-text-muted">{s.securitySec.logoutConfirmDesc}</p>
                          <div className="flex gap-2 pt-1">
                            <button type="button" onClick={() => setShowLogoutConfirm(false)} className="px-3 py-1.5 rounded-lg glass-card text-xs font-bold">
                              {dict.common.cancel}
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                setShowLogoutConfirm(false);
                                onClose();
                                onLogoutAccount();
                              }}
                              className="px-4 py-1.5 rounded-lg bg-amber-500 text-black text-xs font-black"
                            >
                              {s.securitySec.logoutBtn}
                            </button>
                          </div>
                        </div>
                      )}

                      {showDeleteConfirm && (
                        <div className="p-4 rounded-2xl surface-field border-2 border-rose-500 space-y-2.5">
                          <div className="text-xs font-black text-rose-400">{s.securitySec.deleteConfirmTitle}</div>

      const [taskFilterCategory, setTaskFilterCategory] = useState('all');

      // Tasbih Target State
      const [tasbihTarget, setTasbihTarget] = useState(33);

      // Live Adhan Engine State (Every-Second Monitor & Modal)
      const [activeAdhanAlert, setActiveAdhanAlert] = useState(null);
      const [isPreviewingAdhan, setIsPreviewingAdhan] = useState(false);
      const lastTriggeredAdhanRef = useRef('');

      // New Medicine State
      const [showMedModal, setShowMedModal] = useState(false);
      const [medName, setMedName] = useState('');
      const [medDose, setMedDose] = useState('1 Cap');
      const [medTime, setMedTime] = useState('09:00');
      const [medCat, setMedCat] = useState('vitamin');

      // New Family Birthday State
      const [famName, setFamName] = useState('');
      const [famRel, setFamRel] = useState('Family');
      const [famDate, setFamDate] = useState('');

      // Zero-Friction Smart AI Voice / Text Quick-Capture State
      const [quickInputText, setQuickInputText] = useState('');
      const [isListeningVoice, setIsListeningVoice] = useState(false);
      const [isOnline, setIsOnline] = useState(() => typeof navigator !== 'undefined' ? navigator.onLine : true);

      useEffect(() => {
        const onOnline = () => setIsOnline(true);
        const onOffline = () => setIsOnline(false);
        window.addEventListener('online', onOnline);
        window.addEventListener('offline', onOffline);
        return () => {
          window.removeEventListener('online', onOnline);
          window.removeEventListener('offline', onOffline);
        };
      }, []);

      const handleSmartQuickCapture = (rawText) => {
        const text = String(rawText || quickInputText || '').trim();
        if (!text) return;
        const lower = text.toLowerCase();
        const numMatch = text.match(/(\d+)/);
        const numVal = numMatch ? parseInt(numMatch[1], 10) : null;

        if (lower.includes('ماء') || lower.includes('ميه') || lower.includes('water') || lower.includes('ml') || lower.includes('پانی') || lower.includes('su') || lower.includes('eau')) {
          const ml = numVal && numVal >= 50 && numVal <= 3000 ? numVal : 250;
          handleAddWater(ml, `⚡ ${ml}ml`);
          showToast(`💧 +${ml}ml Water logged (+5 XP)!`);
        } else if (lower.includes('بروتين') || lower.includes('وجبة') || lower.includes('protein') || lower.includes('meal') || lower.includes('kcal') || lower.includes('سعرة')) {
          const grams = numVal && numVal <= 250 ? numVal : 30;
          soundFX.playCelebration();
          setState((prev) => ({
            ...prev,
            vitals: {
              ...prev.vitals,
              proteinGrams: (prev.vitals.proteinGrams || 0) + grams,
              caloriesConsumed: (prev.vitals.caloriesConsumed || 0) + (grams * 12)
            }
          }));
          awardXP(10);
          showToast(`🥗 +${grams}g Protein Meal logged (+10 XP)!`);
        } else if (lower.includes('خطوة') || lower.includes('خطوات') || lower.includes('مشي') || lower.includes('step') || lower.includes('walk')) {
          const stp = numVal && numVal >= 100 ? numVal : 1000;
          soundFX.playClick();
          setState((prev) => ({
            ...prev,
            vitals: { ...prev.vitals, steps: (prev.vitals.steps || 0) + stp }
          }));
          awardXP(10);
          showToast(`👟 +${stp} Steps logged (+10 XP)!`);
        } else {
          soundFX.playClick();
          setState((prev) => ({
            ...prev,
            tasks: [
              { id: `tsk_${Date.now()}`, titleAr: text, titleEn: text, priority: 'high', completed: false },
              ...prev.tasks
            ]
          }));
          awardXP(5);
          showToast(`✅ Task added: "${text}"`);
        }
        setQuickInputText('');
      };

      const handleVoiceQuickCapture = () => {
        const SpeechRec = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);
        if (!SpeechRec) {
          showToast(isAr ? 'اكتب في شريط الإدخال السريع وسيتم التسجيل بضغطة واحدة ⚡' : 'Type in the quick bar for 1-tap smart logging ⚡');
          return;
        }
        try {
          const recognition = new SpeechRec();
          recognition.lang = lang === 'ar' ? 'ar-EG' : lang === 'ur' ? 'ur-PK' : lang === 'tr' ? 'tr-TR' : lang === 'fr' ? 'fr-FR' : lang === 'hi' ? 'hi-IN' : 'en-US';
          setIsListeningVoice(true);
          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setQuickInputText(transcript);
            handleSmartQuickCapture(transcript);
            setIsListeningVoice(false);
          };
          recognition.onerror = () => setIsListeningVoice(false);
          recognition.onend = () => setIsListeningVoice(false);
          recognition.start();
        } catch (e) {
          setIsListeningVoice(false);
        }
      };

      const handleToggleGentleRecovery = () => {
        soundFX.playCelebration();
        const nextMode = !state.user.gentleRecoveryMode;
        setState((prev) => ({
          ...prev,
          user: {
            ...prev.user,
            gentleRecoveryMode: nextMode,
            shieldActiveToday: nextMode ? true : prev.user.shieldActiveToday
          },
          vitals: {
            ...prev.vitals,
            stepsGoal: nextMode ? 4000 : 10000
          }
        }));
        showToast(
          nextMode
            ? (isAr ? '🛡️ تم تفعيل درع حماية السلسلة ووضع التعاطف المرن! خذ قسطاً من الراحة دون قلق.' : '🛡️ Streak Shield & Gentle Recovery Mode activated! Your streak is protected.')
            : (isAr ? '⚡ عدت لوضع الطاقة الكاملة!' : '⚡ Full Performance Mode restored!')
        );
      };

      const syncTimerRef = useRef(null);
      const lang = state.user.language || 'ar';
      const t = I18N[lang] || I18N.ar;
      const isRtl = t.dir === 'rtl';
      const isAr = lang === 'ar' || lang === 'ur';

      // Sync DOM attributes & CSS root variables whenever user appearance/language changes
      useEffect(() => {
        syncDOMAppearance(state.user);
      }, [state.user]);

      // Automatic GPS Prayer Time Sync on Startup
      useEffect(() => {
        if (typeof navigator !== 'undefined' && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              const autoPrayers = calculatePrayerTimes(new Date(), latitude, longitude);
              setState((prev) => ({
                ...prev,
                user: { ...prev.user, latitude, longitude },
                prayers: prev.prayers.map((oldP) => {
                  const updatedP = autoPrayers.find((np) => np.id === oldP.id);
                  return updatedP ? { ...updatedP, completed: oldP.completed, sunnahCompleted: oldP.sunnahCompleted } : oldP;
                })
              }));
            },
            () => { }
          );
        }
      }, []);

      // Save locally & silently sync in background
      useEffect(() => {
        saveStateLocally(state);
        if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
        syncTimerRef.current = setTimeout(async () => {
          if (state.user.autoSyncEnabled !== false) {
            setSyncStatus('syncing');
            await pushClientStateToCloud(state);
            setSyncStatus('synced');
          }
        }, 1200);
      }, [state]);

      // Real-Time Adhan Monitor (Checks every second against local prayer times)
      const getSelectedMuezzin = () => {
        if (state.user.customSheikhName && state.user.customSheikhName.trim()) {
          const clean = state.user.customSheikhName.trim().replace(/\.mp3$/i, '');
          return {
            id: 'custom',
            sheikhName: clean,
            nameAr: `الشيخ ${clean}`,
            nameEn: `Sheikh ${clean}`,
            src: `Adhan/${clean}.mp3`
          };
        }
        return ADHAN_MUEZZINS_LIST.find((m) => m.id === state.user.adhanMuezzinId) || ADHAN_MUEZZINS_LIST[2];
      };

      const triggerAdhanNow = (prayerObj) => {
        const muezzin = getSelectedMuezzin();
        setActiveAdhanAlert({
          prayer: prayerObj,
          muezzin,
          triggeredAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        setIsPreviewingAdhan(true);
        soundFX.playAdhanAudio(muezzin.src, state.user.adhanVolume ?? 0.85, () => {
          setIsPreviewingAdhan(false);
        });
      };

      const stopAdhanNow = () => {
        soundFX.stopAdhanAudio();
        setIsPreviewingAdhan(false);
        setActiveAdhanAlert(null);
      };

      useEffect(() => {
        if (state.user.adhanEnabled === false) return;
        const interval = setInterval(() => {
          const now = new Date();
          const hh = now.getHours().toString().padStart(2, '0');
          const mm = now.getMinutes().toString().padStart(2, '0');
          const currentHM = `${hh}:${mm}`;
          const dateKey = now.toISOString().slice(0, 10);

          (state.prayers || []).forEach((p) => {
            if (p.id === 'sunrise') return;
            const prayerAllowed = !state.user.adhanPerPrayer || state.user.adhanPerPrayer[p.id] !== false;
            const uniqueTriggerKey = `${dateKey}_${p.id}_${currentHM}`;
            if (prayerAllowed && p.time === currentHM && lastTriggeredAdhanRef.current !== uniqueTriggerKey) {
              lastTriggeredAdhanRef.current = uniqueTriggerKey;
              triggerAdhanNow(p);
            }
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [state.prayers, state.user.adhanEnabled, state.user.adhanMuezzinId, state.user.customSheikhName, state.user.adhanVolume, state.user.adhanPerPrayer]);

      // Rest Timer Countdown
      useEffect(() => {
        if (!isRestRunning || restSecondsLeft <= 0) return;
        const timer = setInterval(() => {
          setRestSecondsLeft((prev) => {
            if (prev <= 1) {
              setIsRestRunning(false);
              soundFX.playTimerAlarm();
              showToast('💪 Rest complete!');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isRestRunning, restSecondsLeft]);

      // Pomodoro Focus Countdown
      useEffect(() => {
        if (!isFocusRunning || focusSeconds <= 0) return;
        const timer = setInterval(() => {
          setFocusSeconds((prev) => {
            if (prev <= 1) {
              setIsFocusRunning(false);
              soundFX.playCelebration();
              awardXP(25);
              showToast('🎯 Focus session completed (+25 XP)!');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isFocusRunning, focusSeconds]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const awardXP = (amount) => {
        setState((prev) => {
          const nextXp = (prev.user.xp || 0) + amount;
          const nextLevel = Math.floor(nextXp / 100) + 1;
          return { ...prev, user: { ...prev.user, xp: nextXp, level: nextLevel } };
        });
      };

      const updateUserField = (patch) => {
        setState((prev) => ({
          ...prev,
          user: { ...prev.user, ...patch }
        }));
      };

      const handleLogoutAccount = () => {
        soundFX.playClick();
        updateUserField({ isOnboarded: false });
        showToast('👋 Logged out safely');
      };

      const handleDeleteAccountPermanently = () => {
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem('sahly_day_ultra_os_v3');
        } catch (e) { }
        const freshProfile = { ...DEFAULT_USER_PROFILE, clientId: generateClientId(), isOnboarded: false };
        setState({
          user: freshProfile,
          prayers: calculatePrayerTimes(new Date(), freshProfile.latitude, freshProfile.longitude),
          athkar: { morningCompleted: false, eveningCompleted: false, quranPagesRead: 0, quranDailyTarget: 4, khatmahTotalPages: 0, tasbihCount: 0, tasbihPhrase: 'سبحان الله وبحمده', items: DEFAULT_ATHKAR_LIST },
          weeklyWorkouts: generateWeeklySchedule(freshProfile.workoutSplitId, freshProfile.trainingDays),
          medicines: DEFAULT_MEDICINES,
          hydration: { currentMl: 0, targetMl: freshProfile.waterDailyTargetMl, cupSizeMl: 250, logs: [] },
          vitals: { bloodPressure: '120/80', bloodSugar: '95', heartRate: '72', sleepHours: 7.5, steps: 0, stepsGoal: 10000, proteinGrams: 0, caloriesConsumed: 0, mood: 'energetic' },
          tasks: DEFAULT_TASKS
        });
      };

      // Computed Daily Progress Score
      const dailyProgressPercentage = useMemo(() => {
        const prayersDone = state.prayers.filter((p) => p.id !== 'sunrise' && p.completed).length;
        const waterRatio = Math.min(1, state.hydration.currentMl / (state.hydration.targetMl || 2500));
        const currentDayIdx = new Date().getDay();
        const todayW = state.weeklyWorkouts.find((w) => w.dayOfWeek === currentDayIdx) || state.weeklyWorkouts[0];
        const exTotal = todayW?.exercises?.length || 1;
        const exDone = todayW?.exercises?.filter((e) => e.completed).length || 0;
        const medsTotal = state.medicines.length || 1;
        const medsDone = state.medicines.filter((m) => m.completedToday).length;
        const tasksTotal = state.tasks.length || 1;
        const tasksDone = state.tasks.filter((item) => item.completed).length;

        const score = ((prayersDone / 5) * 30) + (waterRatio * 20) + ((exDone / exTotal) * 20) + ((medsDone / medsTotal) * 15) + ((tasksDone / tasksTotal) * 15);
        return Math.min(100, Math.round(score));
      }, [state]);

      // Computed Nutrition & BMI
      const nutritionMetrics = useMemo(() => {
        const w = state.user.weightKg || 75;
        const h = state.user.heightCm || 175;
        const age = state.user.ageYears || 28;
        const bmi = (w / Math.pow(h / 100, 2)).toFixed(1);
        const bmr = Math.round(10 * w + 6.25 * h - 5 * age + 5);
        const tdeeBase = Math.round(bmr * 1.55);
        const targetCalories = state.user.fitnessGoal === 'cut' ? tdeeBase - 450 : state.user.fitnessGoal === 'bulk' ? tdeeBase + 350 : tdeeBase;
        const proteinTarget = Math.round(w * 2.0);
        const fatsTarget = Math.round((targetCalories * 0.25) / 9);
        const carbsTarget = Math.round((targetCalories - (proteinTarget * 4) - (fatsTarget * 9)) / 4);
        return { bmi, bmr, tdeeBase, targetCalories, proteinTarget, fatsTarget, carbsTarget };
      }, [state.user.weightKg, state.user.heightCm, state.user.ageYears, state.user.fitnessGoal]);

      // Handlers
      const handleOnboardingComplete = (newProfile) => {
        const updatedPrayers = calculatePrayerTimes(new Date(), newProfile.latitude, newProfile.longitude);
        const updatedWorkouts = generateWeeklySchedule(newProfile.workoutSplitId, newProfile.trainingDays);
        setState((prev) => ({
          ...prev,
          user: newProfile,
          prayers: updatedPrayers,
          weeklyWorkouts: updatedWorkouts,
          hydration: { ...prev.hydration, targetMl: newProfile.waterDailyTargetMl }
        }));
        showToast('⚡ ' + t.appName);
      };

      const handleTogglePrayer = (prayerId) => {
        soundFX.playClick();
        setState((prev) => ({
          ...prev,
          prayers: prev.prayers.map((p) => p.id === prayerId ? { ...p, completed: !p.completed } : p)
        }));
        awardXP(15);
      };

      const handleToggleSunnah = (prayerId) => {
        soundFX.playClick();
        setState((prev) => ({
          ...prev,
          prayers: prev.prayers.map((p) => p.id === prayerId ? { ...p, sunnahCompleted: !p.sunnahCompleted } : p)
        }));
        awardXP(10);
      };

      const handleDetectGPS = () => {
        if (!navigator.geolocation) {
          showToast('Geolocation not supported');
          return;
        }
        showToast('🛰️ GPS...');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            const newPrayers = calculatePrayerTimes(new Date(), latitude, longitude);
            setState((prev) => ({
              ...prev,
              user: { ...prev.user, latitude, longitude, cityName: `GPS (${latitude.toFixed(2)}, ${longitude.toFixed(2)})` },
              prayers: newPrayers
            }));
            soundFX.playCelebration();
          },
          () => showToast('GPS unavailable')
        );
      };

      const handleAddWater = (amountMl, drinkLabel) => {
        soundFX.playWaterDrop();
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setState((prev) => ({
          ...prev,
          hydration: {
            ...prev.hydration,
            currentMl: prev.hydration.currentMl + amountMl,
            logs: [{ time: timeStr, amountMl, type: drinkLabel || '💧 Water' }, ...prev.hydration.logs]
          }
        }));
        awardXP(5);
      };

      const handleChangeWorkoutSplit = (newSplitId) => {
        soundFX.playCelebration();
        setState((prev) => ({
          ...prev,
          user: { ...prev.user, workoutSplitId: newSplitId },
          weeklyWorkouts: generateWeeklySchedule(newSplitId, prev.user.trainingDays)
        }));
      };

      const handleToggleExercise = (dayOfWeek, exId) => {
        soundFX.playClick();
        setState((prev) => ({
          ...prev,
          weeklyWorkouts: prev.weeklyWorkouts.map((w) => {
            if (w.dayOfWeek !== dayOfWeek) return w;
            return {
              ...w,
              exercises: w.exercises.map((e) => e.id === exId ? { ...e, completed: !e.completed } : e)
            };
          })
        }));
        awardXP(10);
      };

      const handleUpdateExerciseWeight = (dayOfWeek, exId, newWeight) => {
        setState((prev) => ({
          ...prev,
          weeklyWorkouts: prev.weeklyWorkouts.map((w) => {
            if (w.dayOfWeek !== dayOfWeek) return w;
            return {
              ...w,
              exercises: w.exercises.map((e) => e.id === exId ? { ...e, weightKg: Number(newWeight) || 0 } : e)
            };
          })
        }));
      };

      const handleAddCustomExercise = () => {
        if (!newExName.trim()) return;
        soundFX.playClick();
        const customEx = {
          id: `custom_${Date.now()}`,
          nameAr: newExName.trim(),
          nameEn: newExName.trim(),
          sets: newExSets,
          reps: newExReps,
          weightKg: Number(newExWeight) || 0,
          completed: false
        };
        setState((prev) => ({
          ...prev,
          weeklyWorkouts: prev.weeklyWorkouts.map((w) => {
            if (w.dayOfWeek !== selectedWorkoutDay) return w;
            return { ...w, isRestDay: false, exercises: [...w.exercises, customEx] };
          })
        }));
        setNewExName('');
      };

      const startRestTimer = (seconds) => {
        soundFX.playClick();
        setRestTotalSeconds(seconds);
        setRestSecondsLeft(seconds);
        setIsRestRunning(true);
      };

      if (!state.user.isOnboarded) {
        return (
          <OnboardingWizard
            initialProfile={state.user}
            onComplete={handleOnboardingComplete}
            onRestoreCloud={(cloudState) => setState((prev) => ({ ...prev, ...cloudState, user: { ...prev.user, ...(cloudState.user || {}), isOnboarded: true } }))}
          />
        );
      }

      const upcomingPrayer = getUpcomingPrayer(state.prayers);
      const currentDayIndex = new Date().getDay();
      const todayWorkout = state.weeklyWorkouts.find((w) => w.dayOfWeek === currentDayIndex) || state.weeklyWorkouts[0];
      const activeWorkoutPlan = state.weeklyWorkouts.find((w) => w.dayOfWeek === selectedWorkoutDay) || todayWorkout;

      const navItems = [
        { id: 'timeline', label: t.nav.dashboard, icon: '⚡' },
        { id: 'fitness', label: t.nav.fitness, icon: '💪' },
        { id: 'prayers', label: t.nav.prayers, icon: '🕌' },
        { id: 'medicines', label: t.nav.health, icon: '🩺' },
        { id: 'focus', label: t.nav.focus, icon: '🎯' },
        { id: 'hydration', label: t.nav.hydration, icon: '💧' },
        { id: 'levels', label: isAr ? 'المستويات' : 'Levels', icon: '🏆' },
        { id: 'birthdays', label: t.nav.family, icon: '🎂' },
        { id: 'cloud', label: t.nav.cloud, icon: '🎨' }
      ];

      return (
        <div className="min-h-screen pb-36 lg:pb-12">
          {/* ====================================================================
              DYNAMIC LOGICAL HEADER (RTL: Brand Right, Settings Gear Top-Left;
              LTR: Brand Left, Settings Gear Top-Right via flex justify-between)
              ==================================================================== */}
          <header className="sticky top-0 z-40 glass-card border-x-0 border-t-0 py-3">
            <div className="max-w-7xl mx-auto logical-header-bar gap-3">
              {/* Reading Start: Clean Mobile-First Brand, Avatar & Hero Name */}
              <div className="flex items-center gap-3 cursor-pointer min-w-0" onClick={() => setActiveTab('timeline')}>
                <img
                  src={state.user.avatar || LOGO_FILE_PATH}
                  onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = FALLBACK_SVG_LOGO; }}
                  alt="Avatar"
                  className="w-11 h-11 rounded-2xl object-cover border-2 border-cyan-400 shadow-lg shrink-0"
                />
                <div className="logical-start-text min-w-0">
                  <div className="font-black text-lg sm:text-xl tracking-tight leading-none truncate">
                    <BrandName />
                  </div>
                  <div className="text-xs sm:text-sm accent-text font-black truncate mt-1">
                    {state.user.name}
                  </div>
                </div>
              </div>

              {/* Opposite Side of Reading Start (`inset-inline-end`):
                  Top-Left in RTL (ar, ur) / Top-Right in LTR (en, tr, fr, hi) */}
              <div className="flex items-center gap-2">
                {/* Quick Language Pill */}
                <select
                  aria-label="Quick Language Switcher"
                  value={state.user.language}
                  onChange={(e) => { soundFX.playClick(); updateUserField({ language: e.target.value }); }}
                  className="hidden sm:block px-3 py-2 rounded-xl surface-field text-xs font-black touch-target"
                >
                  {LANGUAGES_LIST.map((l) => (
                    <option key={l.code} value={l.code}>
                      {l.flag} {l.name}
                    </option>
                  ))}
                </select>

                {/* Primary Global Settings Trigger Button (Gear Icon at inset-inline-end) */}
                <button
                  id="global-settings-trigger"
                  type="button"
                  onClick={() => { soundFX.playClick(); setIsSettingsOpen(true); }}
                  aria-label={t.common.settingsBtn}
                  className="btn-primary px-4 py-2.5 rounded-2xl text-xs font-black flex items-center gap-2 touch-target shadow-lg"
                >
                  <span className="text-base leading-none">⚙️</span>
                  <span>{t.common.settingsBtn}</span>
                </button>
              </div>
            </div>

            {/* Desktop Segmented Navigation Dock */}
            <div className="max-w-7xl mx-auto hidden lg:flex flex-wrap items-center gap-2 pt-3 mt-3 px-4 border-t theme-border">
              {navItems.map((item) => {
                const active = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => { soundFX.playClick(); setActiveTab(item.id); }}
                    className={`px-3.5 py-2 rounded-2xl text-xs font-black flex items-center gap-2 transition-all ${active ? 'btn-primary shadow-md' : 'glass-card opacity-80 hover:opacity-100'
                      }`}
                  >
                    <NavSvgIcon id={item.id} className="w-4 h-4" />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </div>
          </header>

          {/* GLOBAL SETTINGS MODAL / DRAWER */}
          <GlobalSettingsModal
            isOpen={isSettingsOpen}
            onClose={() => setIsSettingsOpen(false)}
            user={state.user}
            onUpdateUser={updateUserField}
            onLogoutAccount={handleLogoutAccount}
            onDeleteAccountPermanently={handleDeleteAccountPermanently}
            onShowToast={showToast}
          />

          {/* 🕌 LIVE ADHAN FULL-SCREEN LUXURY MODAL */}
          {activeAdhanAlert && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-lg flex items-center justify-center p-4">
              <div className="w-full max-w-md hero-card rounded-3xl p-6 text-center space-y-4 border-2 border-cyan-400 shadow-2xl">
                <div className="w-16 h-16 mx-auto rounded-full btn-primary flex items-center justify-center text-3xl animate-pulse">
                  🕌
                </div>
                <span className="text-xs font-black px-3 py-1 rounded-full bg-cyan-500/20 accent-text border theme-border inline-block">
                  📍 {state.user.cityName} • {activeAdhanAlert.triggeredAt}
                </span>
                <h2 className="text-xl sm:text-2xl font-black leading-snug">
                  {isAr
                    ? `🕌 حان الآن موعد أذان ${activeAdhanAlert.prayer.nameAr} حسب التوقيت المحلي لموقعك`
                    : `🕌 It is now time for ${activeAdhanAlert.prayer.nameEn} Adhan at your local time`}
                </h2>
                <p className="text-xs font-bold accent-text">
                  🎙️ {isAr ? activeAdhanAlert.muezzin.nameAr : activeAdhanAlert.muezzin.nameEn}
                </p>
                <div className="space-y-2.5 pt-2">
                  <button
                    type="button"
                    onClick={stopAdhanNow}
                    className="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-500 text-white font-black text-sm touch-target shadow-lg"
                  >
                    🔇 {isAr ? 'إيقاف / كتم الأذان الآن' : 'Stop / Mute Adhan Now'}
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      if (!activeAdhanAlert.prayer.completed) {
                        handleTogglePrayer(activeAdhanAlert.prayer.id);
                      }
                      stopAdhanNow();
                      showToast(isAr ? 'تقبل الله طاعتكم! تم تسجيل الصلاة ✅' : 'Prayer logged! May Allah accept it ✅');
                    }}
                    className="w-full py-3.5 rounded-2xl btn-primary font-black text-sm touch-target shadow-lg"
                  >
                    ✅ {isAr ? `صليت (تسجيل صلاة ${activeAdhanAlert.prayer.nameAr})` : `I Prayed (Log ${activeAdhanAlert.prayer.nameEn})`}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 hero-card px-5 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm font-black text-center max-w-md w-11/12">
              {toastMsg}
            </div>
          )}

          {/* MAIN CONTENT CONTAINER */}
          <main className="max-w-7xl mx-auto px-3 sm:px-6 py-5">
            {/* ==================== 1. DASHBOARD / TIMELINE TAB ==================== */}
            {activeTab === 'timeline' && (
              <div className="space-y-5">
                {/* ZERO-FRICTION 1-TAP & AI VOICE/TEXT OMNI-CAPTURE BAR + CONTEXTUAL NUDGE */}
                <div className="glass-card rounded-3xl p-4 sm:p-5 space-y-3 border border-cyan-500/30">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping" />
                      <span className="text-xs font-black accent-text">
                        {isAr ? 'إدخال ذكي فوري (بضغطة واحدة أو بالصوت / النص الطبيعي)' : 'Zero-Friction Smart Capture (1-Tap or AI Voice / Natural Text)'}
                      </span>
                    </div>
                    <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-400/30">
                      💡 {state.hydration.currentMl < 1000
                        ? (isAr ? 'تنبيه ذكي لطيف: اشرب كوب ماء الآن لتنشيط تركيزك 💧' : 'Smart Nudge: Sip 250ml water now to boost focus 💧')
                        : (isAr ? `تنبيه ذكي: الصلاة القادمة ${upcomingPrayer.prayer.nameAr} الساعة ${formatClockDisplay(upcomingPrayer.prayer.time, state.user.timeFormat)} 🕌` : `Smart Nudge: Next prayer ${upcomingPrayer.prayer.nameEn} at ${formatClockDisplay(upcomingPrayer.prayer.time, state.user.timeFormat)} 🕌`)}
                    </span>
                  </div>

                  <div className="flex flex-wrap sm:flex-nowrap gap-2">
                    <input
                      type="text"
                      value={quickInputText}

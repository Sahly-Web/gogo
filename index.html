                    </select>
                    <button
                      type="button"
                      onClick={() => {
                        if (!newTaskTitle.trim()) return;
                        soundFX.playClick();
                        setState((prev) => ({
                          ...prev,
                          tasks: [
                            { id: `tsk_${Date.now()}`, titleAr: newTaskTitle.trim(), titleEn: newTaskTitle.trim(), priority: newTaskPriority, category: newTaskCategory, completed: false },
                            ...prev.tasks
                          ]
                        }));
                        setNewTaskTitle('');
                      }}
                      className="btn-primary px-4 py-2.5 rounded-xl text-xs font-black"
                    >
                      {t.common.add}
                    </button>
                  </div>

                  <div className="space-y-2">
                    {state.tasks
                      .filter((tsk) => taskFilterCategory === 'all' || (tsk.category || 'personal') === taskFilterCategory)
                      .map((tsk) => (
                        <div
                          key={tsk.id}
                          className={`p-3.5 rounded-2xl border flex items-center justify-between gap-2 ${tsk.completed ? 'bg-emerald-500/15 border-emerald-400 opacity-80' : 'surface-field'
                            }`}
                        >
                          <div
                            onClick={() => {
                              soundFX.playClick();
                              setState((prev) => ({
                                ...prev,
                                tasks: prev.tasks.map((item) => item.id === tsk.id ? { ...item, completed: !item.completed } : item)
                              }));
                              awardXP(10);
                            }}
                            className="flex items-center gap-3 cursor-pointer flex-1"
                          >
                            <span className="text-lg">{tsk.completed ? '✅' : '⬜'}</span>
                            <div className={`text-xs sm:text-sm font-black ${tsk.completed ? 'line-through' : ''}`}>
                              {isAr ? tsk.titleAr : tsk.titleEn}
                            </div>
                          </div>
                          <button
                            type="button"
                            onClick={() => setState((prev) => ({ ...prev, tasks: prev.tasks.filter((item) => item.id !== tsk.id) }))}
                            className="text-xs text-rose-400 p-1"
                          >
                            🗑️
                          </button>
                        </div>
                      ))}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 6. HYDRATION TAB ==================== */}
            {activeTab === 'hydration' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-6 hero-card rounded-3xl p-6 text-center space-y-4">
                  <h2 className="text-2xl font-black">💧 {t.nav.hydration}</h2>
                  <div className="w-36 h-48 mx-auto border-2 border-cyan-400 rounded-b-3xl rounded-t-xl relative overflow-hidden bg-slate-950 shadow-2xl">
                    <div
                      className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-blue-600 via-cyan-500 to-cyan-300 transition-all duration-500 flex items-center justify-center"
                      style={{ height: `${Math.min(100, Math.round((state.hydration.currentMl / (state.hydration.targetMl || 2500)) * 100))}%` }}
                    >
                      <span className="text-black font-mono font-black text-base">
                        {Math.min(100, Math.round((state.hydration.currentMl / (state.hydration.targetMl || 2500)) * 100))}%
                      </span>
                    </div>
                  </div>

                  <div className="text-xl font-mono font-black accent-text">
                    {state.hydration.currentMl} / {state.hydration.targetMl} ml
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <button
                      type="button"
                      onClick={() => handleAddWater(250, '💧 250ml')}
                      className="btn-primary py-2.5 rounded-2xl text-xs font-black touch-target"
                    >
                      +250 ml 💧
                    </button>
                    <button
                      type="button"
                      onClick={() => handleAddWater(500, '🍼 500ml')}
                      className="glass-card py-2.5 rounded-2xl text-xs font-black touch-target"
                    >
                      +500 ml 🍼
                    </button>
                    <button
                      type="button"
                      onClick={() => handleAddWater(200, '🍵 200ml')}
                      className="glass-card py-2.5 rounded-2xl text-xs font-black touch-target"
                    >
                      +200 ml 🍵
                    </button>
                  </div>
                </div>

                <div className="lg:col-span-6 glass-card rounded-3xl p-5 space-y-3">
                  <div className="flex items-center justify-between border-b theme-border pb-2.5">
                    <h3 className="font-black text-base">Log</h3>
                    <button
                      type="button"
                      onClick={() => setState((prev) => ({ ...prev, hydration: { ...prev.hydration, currentMl: 0, logs: [] } }))}
                      className="text-xs text-rose-400 font-bold"
                    >
                      Reset ↺
                    </button>
                  </div>
                  <div className="space-y-2 max-h-72 overflow-y-auto">
                    {state.hydration.logs.map((log, i) => (
                      <div key={i} className="p-3 rounded-2xl surface-field flex items-center justify-between text-xs font-bold">
                        <span>{log.type || '💧'}</span>
                        <span className="font-mono accent-text">+{log.amountMl} ml</span>
                        <span className="font-mono theme-text-muted">{log.time}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 7. DEDICATED LEVELS, XP & BADGES PAGE ('levels') ==================== */}
            {activeTab === 'levels' && (
              <div className="space-y-5">
                <div className="hero-card rounded-3xl p-6 space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div className="logical-start-text space-y-1">
                      <span className="text-xs font-black px-3 py-1 rounded-full bg-cyan-500/20 accent-text border theme-border">
                        🏆 GAMIFICATION & LEVEL PROGRESSION
                      </span>
                      <h1 className="text-2xl sm:text-3xl font-black pt-1">
                        {isAr ? `مركز المستويات والنقاط — ${state.user.name}` : `Levels, XP & Trophies — ${state.user.name}`}
                      </h1>
                      <p className="text-xs theme-text-muted font-bold">
                        {isAr
                          ? 'كل صلاة أو تمرين أو شرب ماء أو مهمة تنجزها تزيد نقاطك وترفع مستواك تلقائياً'
                          : 'Every completed prayer, workout, water cup, or task awards XP and levels you up'}
                      </p>
                    </div>
                    <div className="flex items-center gap-3 glass-card px-5 py-3 rounded-2xl">
                      <div className="text-center">
                        <span className="text-[11px] theme-text-muted font-bold block">{t.common.level}</span>
                        <span className="text-3xl font-mono font-black accent-text">{state.user.level || 1}</span>
                      </div>
                      <div className="h-8 w-px bg-slate-700" />
                      <div className="text-center">
                        <span className="text-[11px] theme-text-muted font-bold block">{t.common.xp}</span>
                        <span className="text-3xl font-mono font-black text-amber-400">{state.user.xp || 0}</span>
                      </div>
                    </div>
                  </div>

                  {/* Level XP Progress Bar */}
                  <div className="surface-field p-4 rounded-2xl space-y-2">
                    <div className="flex items-center justify-between text-xs font-black">
                      <span>{isAr ? `التقدم نحو المستوى ${(state.user.level || 1) + 1}` : `Progress to Level ${(state.user.level || 1) + 1}`}</span>
                      <span className="font-mono accent-text">{(state.user.xp || 0) % 100} / 100 XP</span>
                    </div>
                    <div className="w-full bg-slate-900/70 h-3.5 rounded-full overflow-hidden p-0.5">
                      <div
                        className="bg-gradient-to-r from-cyan-400 to-blue-500 h-full rounded-full transition-all duration-500"
                        style={{ width: `${Math.max(8, (state.user.xp || 0) % 100)}%` }}
                      />
                    </div>
                  </div>

                  {/* Streak & Shield Summary Cards */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                    <div className="surface-field p-3.5 rounded-2xl">
                      <div className="text-2xl">🔥</div>
                      <div className="text-lg font-mono font-black text-amber-400 mt-1">{state.user.streakDays || 12}</div>
                      <div className="text-[11px] theme-text-muted font-bold">{t.common.streak}</div>
                    </div>
                    <div className="surface-field p-3.5 rounded-2xl">
                      <div className="text-2xl">🛡️</div>
                      <div className="text-lg font-mono font-black text-emerald-400 mt-1">{state.user.streakShields ?? 3}</div>
                      <div className="text-[11px] theme-text-muted font-bold">{isAr ? 'دروع حماية السلسلة' : 'Streak Shields'}</div>
                    </div>
                    <div className="surface-field p-3.5 rounded-2xl">
                      <div className="text-2xl">⚡</div>
                      <div className="text-lg font-mono font-black accent-text mt-1">{dailyProgressPercentage}%</div>
                      <div className="text-[11px] theme-text-muted font-bold">{t.common.todayProgress}</div>
                    </div>
                    <div className="surface-field p-3.5 rounded-2xl">
                      <div className="text-2xl">🎯</div>
                      <div className="text-lg font-mono font-black text-purple-400 mt-1">+25 XP</div>
                      <div className="text-[11px] theme-text-muted font-bold">{isAr ? 'مكافأة جلسة التركيز' : 'Focus Bonus'}</div>
                    </div>
                  </div>
                </div>

                {/* Unlockable Trophies & 7-Day Performance Chart */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                  <div className="lg:col-span-7 glass-card rounded-3xl p-5 space-y-3">
                    <h2 className="font-black text-base flex items-center gap-2">
                      <span>🏅</span>
                      <span>{isAr ? 'الأوسمة والجوائز المفتوحة' : 'Unlocked Trophies & Badges'}</span>
                    </h2>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                      {[
                        { id: 'b1', icon: '🌅', titleAr: 'فارس الفجر (+15 XP)', titleEn: 'Fajr Guardian', unlocked: Boolean(state.prayers.find((p) => p.id === 'fajr')?.completed) },
                        { id: 'b2', icon: '💧', titleAr: 'سيد الترطيب (+20 XP)', titleEn: 'Hydration Master', unlocked: state.hydration.currentMl >= state.hydration.targetMl },
                        { id: 'b3', icon: '🏋️', titleAr: 'بطل اللياقة (+30 XP)', titleEn: 'Iron Athlete', unlocked: (state.vitals.steps || 0) >= 6000 },
                        { id: 'b4', icon: '📖', titleAr: 'رفيق القرآن (+25 XP)', titleEn: 'Quran Companion', unlocked: (state.athkar.quranPagesRead || 0) >= (state.athkar.quranDailyTarget || 4) },
                        { id: 'b5', icon: '🔥', titleAr: 'سلسلة ذهبية (+50 XP)', titleEn: '10+ Day Streak', unlocked: (state.user.streakDays || 0) >= 10 },
                        { id: 'b6', icon: '🛡️', titleAr: 'الدرع الذكي', titleEn: 'Shield Protected', unlocked: (state.user.streakShields || 0) > 0 }
                      ].map((badge) => (
                        <div
                          key={badge.id}
                          className={`p-3.5 rounded-2xl border text-center transition-all ${badge.unlocked ? 'bg-cyan-500/15 border-cyan-400 shadow-md' : 'surface-field opacity-50'
                            }`}
                        >
                          <div className="text-2xl">{badge.icon}</div>
                          <div className="text-xs font-black mt-1">{isAr ? badge.titleAr : badge.titleEn}</div>
                          <div className="text-[10px] font-bold accent-text mt-0.5">
                            {badge.unlocked ? (isAr ? 'مفتوح ✓' : 'Unlocked ✓') : (isAr ? 'قيد التقدم' : 'Locked')}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="lg:col-span-5 glass-card rounded-3xl p-5 space-y-3">
                    <h2 className="font-black text-base flex items-center gap-2">
                      <span>📈</span>
                      <span>{isAr ? 'مؤشر الإنجاز لآخر 7 أيام' : '7-Day Performance History'}</span>
                    </h2>
                    <div className="grid grid-cols-7 gap-2 items-end h-36 pt-4 px-1">
                      {[...(state.dailyHistory || []).slice(-6), { date: state.lastActiveDate || 'Today', score: dailyProgressPercentage }].map((item, i) => (
                        <div key={i} className="flex flex-col items-center gap-1 h-full justify-end">
                          <span className="text-[10px] font-mono font-bold accent-text">{item.score}%</span>
                          <div className="w-full bg-slate-900/60 rounded-t-xl h-24 flex items-end overflow-hidden p-0.5">
                            <div
                              className="w-full rounded-t-lg bg-gradient-to-t from-cyan-500 to-blue-400 transition-all duration-500"
                              style={{ height: `${Math.max(12, item.score)}%` }}
                            />
                          </div>
                          <span className="text-[9px] font-mono theme-text-muted">{String(item.date).slice(-5)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 8. FAMILY & MILESTONES TAB ==================== */}
            {activeTab === 'birthdays' && (
              <div className="space-y-5">
                <div className="hero-card rounded-3xl p-5">
                  <h1 className="text-2xl font-black">🎂 {t.nav.family}</h1>
                </div>

                <div className="glass-card rounded-3xl p-5 space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    <input
                      type="text"
                      placeholder="Name"
                      value={famName}
                      onChange={(e) => setFamName(e.target.value)}
                      className="px-3 py-2.5 rounded-xl surface-field text-xs font-bold"
                    />
                    <input
                      type="text"
                      placeholder="Relation"
                      value={famRel}
                      onChange={(e) => setFamRel(e.target.value)}
                      className="px-3 py-2.5 rounded-xl surface-field text-xs font-bold"
                    />
                    <input
                      type="date"
                      value={famDate}
                      onChange={(e) => setFamDate(e.target.value)}
                      className="px-3 py-2.5 rounded-xl surface-field text-xs font-bold"
                    />
                    <button
                      type="button"
                      onClick={() => {
                        if (!famName || !famDate) return;
                        soundFX.playCelebration();
                        updateUserField({
                          familyBirthdays: [...state.user.familyBirthdays, { id: `fam_${Date.now()}`, name: famName, relation: famRel, birthDate: famDate }]
                        });
                        setFamName('');
                        setFamDate('');
                      }}
                      className="btn-primary py-2.5 rounded-xl text-xs font-black"
                    >
                      {t.common.add}
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-2">
                    {state.user.familyBirthdays.map((item) => {
                      const parts = String(item.birthDate || '2000-01-01').split('-').map(Number);
                      const now = new Date();
                      now.setHours(0, 0, 0, 0);
                      let nextBday = new Date(now.getFullYear(), (parts[1] || 1) - 1, parts[2] || 1);
                      if (nextBday < now) nextBday = new Date(now.getFullYear() + 1, (parts[1] || 1) - 1, parts[2] || 1);
                      const daysLeft = Math.round((nextBday.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
                      const upcomingAge = nextBday.getFullYear() - (parts[0] || 2000);

                      return (
                        <div key={item.id} className="p-4 rounded-2xl surface-field space-y-2.5">
                          <div className="flex items-start justify-between">
                            <div>
                              <div className="font-black text-sm">🎉 {item.name}</div>
                              <div className="text-xs accent-text font-bold">{item.relation}</div>
                              <div className="text-[11px] font-mono theme-text-muted mt-0.5">{item.birthDate}</div>
                            </div>
                            <button
                              type="button"
                              onClick={() => updateUserField({ familyBirthdays: state.user.familyBirthdays.filter((f) => f.id !== item.id) })}
                              className="text-xs text-rose-400 p-1"
                            >
                              🗑️
                            </button>
                          </div>
                          <div className="flex items-center justify-between pt-2 border-t theme-border">
                            <span className="text-[11px] font-black text-amber-400">
                              ⏳ {isAr ? `باقي ${daysLeft} يوم • العمر القادم: ${upcomingAge}` : `${daysLeft}d left • Turning ${upcomingAge}`}
                            </span>
                            <button
                              type="button"
                              onClick={() => {
                                soundFX.playCelebration();
                                showToast(isAr ? `💌 تم نسخ رسالة تهنئة دافئة لـ ${item.name}!` : `💌 Warm greeting copied for ${item.name}!`);
                              }}
                              className="px-2.5 py-1 rounded-xl bg-cyan-500/15 accent-text text-[10px] font-black"
                            >
                              💬 {isAr ? 'تهنئة سريعة' : 'Send Wish'}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 8. PROFILE & THEMES STUDIO TAB ==================== */}
            {activeTab === 'cloud' && (
              <div className="space-y-5">
                <div className="hero-card rounded-3xl p-6 space-y-5">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-4">
                      <img
                        src={state.user.avatar || AVATAR_PRESETS[0]}
                        alt="Profile Avatar"
                        className="w-16 h-16 rounded-full object-cover border-2 border-cyan-400 shadow-xl"
                      />
                      <div className="logical-start-text">
                        <h1 className="text-2xl font-black">{state.user.name}</h1>
                        <p className="text-xs theme-text-muted font-mono">
                          @{state.user.username} • {state.user.email} • {state.user.phone}
                        </p>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        type="button"
                        onClick={() => setIsSettingsOpen(true)}
                        className="btn-primary px-5 py-2.5 rounded-2xl text-xs font-black touch-target"
                      >
                        ⚙️ {t.settings.title}
                      </button>
                      <button
                        type="button"
                        onClick={async () => {
                          setSyncStatus('syncing');
                          await pushClientStateToCloud(state);
                          setSyncStatus('synced');
                          soundFX.playCelebration();
                          showToast('🔒 ' + t.common.synced);
                        }}
                        className="glass-card px-4 py-2.5 rounded-2xl text-xs font-black touch-target"
                      >
                        🔄 {t.common.syncNow}
                      </button>
                    </div>
                  </div>
                </div>

                {/* 7 Interactive Theme Studio Gallery */}
                <div className="glass-card rounded-3xl p-6 space-y-4">
                  <h2 className="text-lg font-black">🎨 7 Flagship Eye-Comfort Themes Studio</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    {THEME_CATALOG.map((th) => {
                      const active = state.user.theme === th.id;
                      return (
                        <button
                          key={th.id}
                          type="button"
                          onClick={() => { soundFX.playClick(); updateUserField({ theme: th.id }); }}
                          className={`p-4 rounded-2xl border flex items-center justify-between transition-all ${active ? 'border-cyan-400 ring-2 ring-cyan-400/30 hero-card scale-[1.01]' : 'surface-field opacity-85 hover:opacity-100'
                            }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="w-9 h-9 rounded-xl flex items-center justify-center text-lg shadow-inner border border-white/20" style={{ background: th.preview }}>
                              {th.icon}
                            </span>
                            <div className="logical-start-text">
                              <div className="font-black text-xs">{isAr ? th.nameAr : th.nameEn}</div>
                              <div className="text-[10px] theme-text-muted">{active ? 'Active ✓' : 'Apply'}</div>
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* NATIVE MOBILE 2-ROW BENTO NAVIGATION DOCK (Zero Scrollbar — All 10 Icons 100% Visible with Crisp Vector SVGs) */}
          <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 glass-card rounded-t-3xl border-b-0 px-2 pt-2 safe-bottom-dock shadow-2xl">
            <div className="grid grid-cols-5 gap-1 max-w-lg mx-auto">
              {navItems.map((item) => {
                const active = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => { soundFX.playClick(); setActiveTab(item.id); }}
                    className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-2xl transition-all ${active ? 'btn-primary shadow-md' : 'surface-field opacity-85 hover:opacity-100'
                      }`}
                  >
                    <NavSvgIcon id={item.id} className="w-4 h-4" />
                    <span className="text-[10px] font-black mt-1 truncate max-w-full leading-tight">
                      {item.label.split(' ')[0]}
                    </span>
                  </button>
                );
              })}
              <button
                type="button"
                onClick={() => { soundFX.playClick(); setIsSettingsOpen(true); }}
                className="flex flex-col items-center justify-center py-1.5 px-1 rounded-2xl surface-field opacity-85 hover:opacity-100"
              >
                <NavSvgIcon id="settings" className="w-4 h-4" />
                <span className="text-[10px] font-black mt-1 truncate max-w-full leading-tight">
                  {t.common.settingsBtn}
                </span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
